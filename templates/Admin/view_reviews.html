{% extends 'Admin/adminhomepage.html' %}
{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Data Table</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- DataTables CSS -->
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Review and Rating</h2>
   <div class="row mb-3">
      <div class="col-md-4">
        <label for="fromDate" class="form-label">From Date</label>
        <input type="date" id="fromDate" class="form-control">
      </div>
      <div class="col-md-4">
        <label for="toDate" class="form-label">To Date</label>
        <input type="date" id="toDate" class="form-control">
      </div>
    </div>
    <table id="complaintTable" class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Review</th>
          <th>Rating</th>
          <th>Username</th>
        </tr>
      </thead>
      <tbody>
        <!-- Sample Data Row -->
        {% for i in data %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ i.date }}</td>
          <td>{{ i.review }}</td>
          <td>{{ i.rating }}</td>
          <td>{{ i.USERS.name }}</td>
        </tr>
        {% endfor %}

        <!-- Add more rows dynamically from backend -->
      </tbody>
    </table>
  </div>

  <!-- Scripts -->
  <script>
    // Extend DataTables with custom date filtering
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
      const min = document.getElementById('fromDate').value;
      const max = document.getElementById('toDate').value;
      const dateStr = data[1]; // Date is column index 1
      const date = new Date(dateStr);

      const minDate = min ? new Date(min) : null;
      const maxDate = max ? new Date(max) : null;

      if ((!minDate || date >= minDate) && (!maxDate || date <= maxDate)) {
        return true;
      }
      return false;
    });

    // Initialize DataTable and bind filter events
    $(document).ready(function () {
      const table = $('#complaintTable').DataTable({
        pageLength: 5
      });

      $('#fromDate, #toDate').on('change', function () {
        table.draw();
      });
    });
  </script>

</body>
</html>
{% endblock %}

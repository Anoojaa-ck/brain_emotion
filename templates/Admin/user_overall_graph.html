<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Overall Analysis - {{ user.username }} | Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .user-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
        }

        .user-avatar i {
            font-size: 40px;
            color: white;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .chart-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .activity-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .activity-high {
            background: #d4edda;
            color: #155724;
        }

        .activity-medium {
            background: #fff3cd;
            color: #856404;
        }

        .activity-low {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-button {
            background: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-button:hover {
            transform: translateX(-5px);
        }

        .stress-indicator {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .stress-bar {
            height: 100%;
            transition: width 0.3s;
        }

        .stress-low { background: #28a745; }
        .stress-medium { background: #ffc107; }
        .stress-high { background: #dc3545; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <button class="back-button" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i> Back
        </button>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p class="mt-3">Loading user data...</p>
        </div>

        <div id="content" style="display: none;">
            <!-- User Header -->
            <div class="user-header">
                <div class="d-flex align-items-center">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <h2 id="user-name" class="mb-2"></h2>
                        <p class="text-muted mb-1"><i class="fas fa-envelope"></i> <span id="user-email"></span></p>
                    </div>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="row">
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #e3f2fd; color: #2196f3;">
                            <i class="fas fa-brain"></i>
                        </div>
                        <div class="stat-value" id="total-brain"></div>
                        <div class="stat-label">Brain Emotion Records</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #fff3e0; color: #ff9800;">
                            <i class="fas fa-book"></i>
                        </div>
                        <div class="stat-value" id="total-diary"></div>
                        <div class="stat-label">Diary Entries</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon" style="background: #fce4ec; color: #e91e63;">
                            <i class="fas fa-heartbeat"></i>
                        </div>
                        <div class="stat-value" id="total-heartbeat"></div>
                        <div class="stat-label">Heartbeat Records</div>
                    </div>
                </div>
            </div>

            <!-- Stress Trend Chart -->
            <div class="chart-card">
                <div class="chart-title">
                    <i class="fas fa-chart-line"></i> Stress Trend (Last 30 Days)
                </div>
                <canvas id="stressChart" height="100"></canvas>
            </div>

            <!-- Emotion Distribution Charts -->
            <div class="row">
                <div class="col-md-6">
                    <div class="chart-card">
                        <div class="chart-title">
                            <i class="fas fa-chart-pie"></i> Brain Emotion Distribution
                        </div>
                        <canvas id="brainEmotionChart" height="250"></canvas>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="chart-card">
                        <div class="chart-title">
                            <i class="fas fa-chart-pie"></i> Diary Emotion Distribution
                        </div>
                        <canvas id="diaryEmotionChart" height="250"></canvas>
                    </div>
                </div>
            </div>

            <!-- Activity Timeline -->
            <div class="chart-card">
                <div class="chart-title">
                    <i class="fas fa-calendar-alt"></i> User Activity Timeline
                </div>
                <canvas id="activityChart" height="80"></canvas>
            </div>

            <!-- Detailed Activity Table -->
            <div class="chart-card">
                <div class="chart-title">
                    <i class="fas fa-table"></i> Daily Activity Details
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Brain Emotions</th>
                                <th>Diary Entries</th>
                                <th>Heartbeat Records</th>
                                <th>Total Activity</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="activity-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stressChart, brainEmotionChart, diaryEmotionChart, activityChart;

        $(document).ready(function() {
            loadUserData();
        });

        function loadUserData() {
            const userId = window.location.pathname.split('/').pop();

            $.ajax({
                url: `/myapp/get_user_graph_data/${userId}/`,
                method: 'GET',
                success: function(response) {
                    $('#loading').hide();
                    $('#content').show();
                    displayUserData(response);
                },
                error: function(xhr) {
                    $('#loading').html('<div class="alert alert-danger">Error loading data: ' + xhr.responseJSON?.error + '</div>');
                }
            });
        }

        function displayUserData(data) {
            // User info
            $('#user-name').text(data.user.name || data.user.username);
            $('#user-email').text(data.user.email || 'Not provided');
            $('#user-joined').text(data.user.joined_date);

            // Statistics
            $('#total-brain').text(data.statistics.total_brain_emotions);
            $('#total-diary').text(data.statistics.total_diary_entries);
            $('#total-heartbeat').text(data.statistics.total_heartbeat_records);

            // Create Stress Chart
            createStressChart(data.chart_data);

            // Create Emotion Distribution Charts
            createBrainEmotionChart(data.statistics.emotion_distribution);
            createDiaryEmotionChart(data.statistics.diary_distribution);

            // Create Activity Chart
            createActivityChart(data.activity_data);

            // Populate Activity Table
            populateActivityTable(data.activity_data);
        }

        function createStressChart(chartData) {
            const ctx = document.getElementById('stressChart').getContext('2d');

            if (stressChart) stressChart.destroy();

            stressChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.dates,
                    datasets: [
                        {
                            label: 'Total Stress',
                            data: chartData.total_stress,
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Brain Stress',
                            data: chartData.brain_stress,
                            borderColor: '#2196f3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Diary Stress',
                            data: chartData.diary_stress,
                            borderColor: '#ff9800',
                            backgroundColor: 'rgba(255, 152, 0, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Heartbeat Stress',
                            data: chartData.heartbeat_stress,
                            borderColor: '#4caf50',
                            backgroundColor: 'rgba(76, 175, 80, 0.1)',
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.raw.toFixed(1) + '%';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Stress Level (%)'
                            },
                            min: 0,
                            max: 100
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        }
                    }
                }
            });
        }

        function createBrainEmotionChart(emotions) {
            const ctx = document.getElementById('brainEmotionChart').getContext('2d');

            if (brainEmotionChart) brainEmotionChart.destroy();

            brainEmotionChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Happy', 'Sad', 'Surprise', 'Angry', 'Neutral', 'Fear'],
                    datasets: [{
                        data: [
                            emotions.happy,
                            emotions.sad,
                            emotions.surprise,
                            emotions.angry,
                            emotions.neutral,
                            emotions.fear
                        ],
                        backgroundColor: [
                            '#4caf50',
                            '#f44336',
                            '#ff9800',
                            '#e91e63',
                            '#9e9e9e',
                            '#3f51b5'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.raw.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        function createDiaryEmotionChart(emotions) {
            const ctx = document.getElementById('diaryEmotionChart').getContext('2d');

            if (diaryEmotionChart) diaryEmotionChart.destroy();

            diaryEmotionChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Happy', 'Neutral', 'Sad', 'Fear', 'Surprise'],
                    datasets: [{
                        data: [
                            emotions.happy,
                            emotions.neutral,
                            emotions.sad,
                            emotions.fear,
                            emotions.surprise
                        ],
                        backgroundColor: [
                            '#4caf50',
                            '#9e9e9e',
                            '#f44336',
                            '#3f51b5',
                            '#ff9800'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.raw.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        function createActivityChart(activityData) {
            const ctx = document.getElementById('activityChart').getContext('2d');

            if (activityChart) activityChart.destroy();

            activityChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: activityData.map(d => d.date),
                    datasets: [
                        {
                            label: 'Brain Emotions',
                            data: activityData.map(d => d.brain_emotions),
                            backgroundColor: '#2196f3',
                            stack: 'activity'
                        },
                        {
                            label: 'Diary Entries',
                            data: activityData.map(d => d.diary_entries),
                            backgroundColor: '#ff9800',
                            stack: 'activity'
                        },
                        {
                            label: 'Heartbeat Records',
                            data: activityData.map(d => d.heartbeat_records),
                            backgroundColor: '#4caf50',
                            stack: 'activity'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Number of Records'
                            },
                            stacked: true
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }

        function populateActivityTable(activityData) {
            const tbody = $('#activity-table-body');
            tbody.empty();

            activityData.forEach(day => {
                const total = day.total_activity;
                let status = '', statusClass = '';

                if (total >= 10) {
                    status = 'High Activity';
                    statusClass = 'activity-high';
                } else if (total >= 5) {
                    status = 'Medium Activity';
                    statusClass = 'activity-medium';
                } else {
                    status = 'Low Activity';
                    statusClass = 'activity-low';
                }

                const row = `
                    <tr>
                        <td>${day.date}</td>
                        <td>${day.brain_emotions}</td>
                        <td>${day.diary_entries}</td>
                        <td>${day.heartbeat_records}</td>
                        <td><strong>${total}</strong></td>
                        <td><span class="activity-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
                tbody.append(row);
            });
        }
    </script>
</body>
</html>
